[package]
name = "ec2-metadata-mock"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local-only EC2 IMDS mock for Docker Compose development"

[lib]
test = false

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
serde_json = "1.0.151"
tower = { version = "0.5.3", features = ["util"] }
